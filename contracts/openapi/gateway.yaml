openapi: 3.0.3
info:
  title: Commerce foundation gateway
  version: 1.0.0
paths:
  /api/v1/platform/status:
    get:
      operationId: GetPlatformStatus
      responses:
        '200':
          description: Foundation status; commerce is not available yet
          content:
            application/json:
              schema:
                type: object
                required: [stage, commerceAvailable]
                properties:
                  stage: { type: string, enum: [foundation] }
                  commerceAvailable: { type: boolean, enum: [false] }
  /health/live:
    get:
      responses:
        '200': { description: Process is live }
  /health/ready:
    get:
      responses:
        '200': { description: Gateway is initialized; not a commerce dependency check }
