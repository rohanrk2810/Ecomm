openapi: 3.0.3
info:
  title: Identity registration
  version: 1.0.0
paths:
  /api/v1/identity/email-verifications:
    post:
      operationId: ConfirmCustomerEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, token]
              properties:
                userId: { type: string, format: uuid }
                token: { type: string, maxLength: 4096, writeOnly: true }
      responses:
        '200': { description: Email confirmed; no session or access token issued }
        '400': { description: Missing, expired, consumed or invalid verification link }
        '429': { description: Account action quota exceeded }
  /api/v1/identity/email-verification-requests:
    post:
      operationId: RequestCustomerEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: Generic pending response; does not prove account existence or email delivery }
        '429': { description: Account action quota exceeded }
  /api/v1/identity/registrations:
    post:
      operationId: RegisterCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, maxLength: 128, writeOnly: true }
      responses:
        '202':
          description: Same pending state for a new or existing eligible registration; no token issued
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending_verification] }
        '400': { description: Invalid body/email/password or unexpected JSON members; safe ProblemDetails }
        '429': { description: Registration quota exceeded }
        '500': { description: Persistence failure; no success implied }
  /api/v1/identity/registration-policy:
    get:
      operationId: GetRegistrationPolicy
      responses:
        '200':
          description: Validated runtime password policy for browser hints; server validation remains authoritative
          content:
            application/json:
              schema:
                type: object
                required: [minimumPasswordLength, maximumPasswordLength, requireDigit, requireUppercase, requireLowercase, requireNonAlphanumeric]
                properties:
                  minimumPasswordLength: { type: integer, minimum: 12 }
                  maximumPasswordLength: { type: integer, maximum: 128 }
                  requireDigit: { type: boolean }
                  requireUppercase: { type: boolean }
                  requireLowercase: { type: boolean }
                  requireNonAlphanumeric: { type: boolean }
