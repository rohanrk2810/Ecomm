name: commerce-local
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: commerce_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev/bootstrap.ps1 first}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_bootstrap -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["127.0.0.1:29092:29092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-storage:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --disableTelemetry
    environment:
      AZURITE_ACCOUNTS: commerce:${OBJECT_STORAGE_KEY:?Run bootstrap first}
    ports: ["127.0.0.1:10000:10000"]
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(2000,()=>process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 20
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./monitoring/otel-collector.yml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:13133:13133"]
  gateway:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: src/gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: localhost;127.0.0.1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ReverseProxy__Clusters__identity__Destinations__one__Address: http://identity:8080
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      otel-collector:
        condition: service_started
  identity:
    profiles: ["identity"]
    build:
      context: ..
      dockerfile: src/services/identity/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Identity: Host=postgres;Database=commerce_identity;Username=commerce_identity;Password=${IDENTITY_DATABASE_PASSWORD:-};Include Error Detail=false;GSS Encryption Mode=Disable
      Messaging__BootstrapServers: kafka:9092
      Messaging__RegistrationTopic: commerce.identity.users.v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Verification__KeyDirectory: /var/commerce/keys
      VerificationDelivery__Enabled: 'true'
      VerificationDelivery__Host: mailpit
    ports: ["127.0.0.1:5082:8080"]
    volumes: ["identity-keys:/var/commerce/keys"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  identity-keys:
  postgres-data:
  kafka-data:
  object-data:
