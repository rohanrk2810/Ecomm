# Review skeleton only. Namespace, immutable image digest, ingress/TLS,
# workload identity and collector endpoint must be supplied by deployment owner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: commerce-gateway }
  template:
    metadata:
      labels: { app: commerce-gateway }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: commerce-gateway:REPLACE_WITH_RELEASE_DIGEST
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: AllowedHosts, value: REPLACE_WITH_APPROVED_HOSTNAME }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-gateway
spec:
  selector: { app: commerce-gateway }
  ports: [{ port: 80, targetPort: 8080 }]
